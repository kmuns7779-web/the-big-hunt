<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Big Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: one test at a time on a "license review" card, a stop tracker on top, a log of passed tests below, and a pop-up for failures. */
  :root {
    --bg: #eef2ee;
    --card: #fbfdfb;
    --ink: #13261f;
    --muted: #53665d;
    --line: #cbd6ce;
    --accent: #d92b66;
    --accent-ink: #ffffff;
    --good: #1c7d52;
    --scrim: rgba(10, 20, 16, .62);
    --display: "Syne", "Helvetica Neue", Arial, sans-serif;
    --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1c17; --card: #16281f; --ink: #e6f0ea; --muted: #93a89d;
      --line: #2a4036; --accent: #ff6b9a; --accent-ink: #1a0910; --good: #5fd09a;
      --scrim: rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1c17; --card: #16281f; --ink: #e6f0ea; --muted: #93a89d;
    --line: #2a4036; --accent: #ff6b9a; --accent-ink: #1a0910; --good: #5fd09a;
    --scrim: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }

  .eyebrow {
    font-family: var(--mono); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); margin: 0;
  }
  h1 {
    font-family: var(--display); font-weight: 800; font-size: clamp(2.3rem, 11vw, 3.4rem);
    line-height: .98; letter-spacing: -.02em; margin: 6px 0 0; text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .lede { color: var(--muted); margin: 10px 0 0; max-width: 46ch; }

  /* tracker */
  .tracker { display: flex; gap: 6px; list-style: none; padding: 0; margin: 0; }
  .tracker li { flex: 1; height: 8px; border-radius: 99px; background: var(--line); transition: background .3s; }
  .tracker li.done { background: var(--good); }
  .tracker li.now { background: var(--accent); }
  .tracker-label {
    display: flex; justify-content: space-between; gap: 12px; margin: 8px 0 0;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    letter-spacing: .06em; text-transform: uppercase;
  }

  /* test card */
  .clue {
    background: var(--card); border: 1.5px solid var(--ink); border-radius: 6px;
    padding: 22px 20px 20px; display: grid; gap: 16px;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .clue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .clue-head h2 { font-family: var(--display); font-size: 1.3rem; font-weight: 800; margin: 0; text-wrap: balance; }
  .tag { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .intro { margin: 0; color: var(--muted); }
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 -8px; }
  .riddle { font-size: 1.25rem; line-height: 1.45; margin: 0; text-wrap: pretty; font-weight: 500; }

  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type="text"] {
    flex: 1 1 180px; min-width: 0; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 6px; padding: 12px 14px;
  }
  input[type="text"]:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 6px; padding: 12px 18px;
    border: 1.5px solid var(--ink); background: var(--accent); color: var(--accent-ink);
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); font-weight: 500; }
  button.ghost:hover { border-color: var(--ink); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .options { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--bg); color: var(--ink); border: 1.5px solid var(--ink);
    font-weight: 500; padding: 14px 16px;
  }
  .opt:hover { background: var(--card); box-shadow: 3px 3px 0 var(--ink); transform: translate(-1px, -1px); }
  .opt .k { font-family: var(--mono); font-weight: 500; color: var(--accent); min-width: 1.2em; }
  .opts-2 { grid-template-columns: 1fr 1fr; }

  .threat {
    margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent);
    background: var(--bg); font-size: .95rem; border-radius: 0 6px 6px 0;
  }
  .threat b { font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: block; }
  .msg { margin: 0; font-size: .95rem; color: var(--muted); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%{transform:translateX(-6px)} 50%{transform:translateX(6px)} 80%{transform:translateX(-3px)} }

  /* passed state */
  .go { position: relative; border: 1.5px dashed var(--good); border-radius: 6px; padding: 16px 16px 14px; background: var(--bg); }
  .go .tag { color: var(--good); }
  .go p { margin: 4px 0 0; font-size: 1.1rem; }
  .stamp {
    position: absolute; top: -14px; right: 12px; transform: rotate(6deg);
    font-family: var(--display); font-weight: 800; font-size: .85rem; letter-spacing: .1em;
    color: var(--good); border: 2px solid var(--good); border-radius: 4px; padding: 2px 8px;
    background: var(--card);
  }

  /* log */
  .log h3 { font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .log ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .log li { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .log .n { font-family: var(--mono); color: var(--good); }
  .log .t { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .log .t span { color: var(--muted); display: block; font-size: .9rem; }

  /* finale */
  .finale { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 28px 22px; display: grid; gap: 12px; box-shadow: 5px 5px 0 var(--ink); border: 1.5px solid var(--ink); }
  .finale h2 { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; text-wrap: balance; }
  .finale p { margin: 0; font-size: 1.1rem; }
  .finale .prize { font-family: var(--mono); font-size: .95rem; background: rgba(0,0,0,.16); padding: 10px 12px; border-radius: 6px; }

  footer { display: flex; justify-content: flex-end; }
  footer button { font-size: .85rem; padding: 8px 12px; }

  /* failure pop-up */
  .scrim {
    position: fixed; inset: 0; z-index: 20; background: var(--scrim);
    display: grid; place-items: center;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .modal {
    width: 100%; max-width: 440px; background: var(--card); color: var(--ink);
    border: 2px solid var(--accent); border-radius: 6px; padding: 22px 20px 20px;
    display: grid; gap: 14px; box-shadow: 6px 6px 0 var(--accent);
    max-height: 100%; overflow-y: auto;
  }
  .modal .siren { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .modal h2 { font-family: var(--display); font-weight: 800; font-size: 1.55rem; line-height: 1.05; margin: 0; text-wrap: balance; }
  .modal p { margin: 0; }
  .modal .extra { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 6px 6px 0; font-size: .95rem; }
  .modal button { justify-self: start; letter-spacing: .06em; }
  .modal .small { color: var(--muted); font-size: .92rem; }

  @media (max-width: 420px) { .opts-2 { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } .tracker li { transition: none; } .opt:hover { transform: none; } }
</style>

<main class="wrap" id="main">
  <header>
    <p class="eyebrow">Boyfriend license renewal</p>
    <h1>The <em>Big</em> Hunt</h1>
    <p class="lede" id="lede"></p>
  </header>

  <section aria-label="Progress">
    <ol class="tracker" id="tracker"></ol>
    <p class="tracker-label"><span id="stopLabel"></span><span id="recordCount"></span></p>
  </section>

  <section id="stage" aria-live="polite"></section>

  <section class="log" id="log" hidden>
    <h3>Tests passed</h3>
    <ol id="logList"></ol>
  </section>

  <footer>
    <button class="ghost" id="reset" type="button">Start over</button>
  </footer>
</main>

<div class="scrim" id="scrim" hidden>
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mTitle" aria-describedby="mBody">
    <p class="siren">Incident report filed</p>
    <h2 id="mTitle">BOYFRIEND PRIVILEGES UNDER REVIEW</h2>
    <div id="mBody" style="display:grid;gap:12px">
      <p>Iron Man, that answer was so embarrassing I've had to contact the authorities.</p>
      <p class="small">You may try again, but this will be on your record.</p>
      <p class="extra" id="mExtra" hidden></p>
    </div>
    <button type="button" id="tryAgain">TRY AGAIN</button>
  </div>
</div>

<script>
  /* ---- EDIT HERE ----------------------------------------------------- */
  var HUNTER = "Iron Man";
  var INTRO = "Five tests stand between you and your boyfriend license. Read carefully and answer like it matters. Every wrong answer goes on your record.";

  var CLUES = [
    {
      code: "01", title: "The Translation Error", type: "text",
      question: "When I say “leave me alone,” what do I mean?",
      answers: ["stay", "please stay", "stay with me", "please stay with me", "i want you to stay", "you stay", "to stay", "please don't go", "don't go", "don't leave", "don't leave me"],
      threat: "If you get this wrong, your boyfriend license is being revoked. You have ONE job.",
      pass: "Correct. License safe, for now.",
      next: ""
    },
    {
      code: "02", title: "The Illegal Hack", type: "text",
      question: "How do you survive an argument?",
      answers: ["apologize", "apoligize", "apologise", "apologize first", "say sorry", "sorry", "i apologize", "you apologize"],
      threat: "If you get this wrong, I'm reporting you.",
      pass: "Correct. Survival odds improved.",
      next: ""
    },
    {
      code: "03", title: "Fake Fan Detected", type: "text",
      question: "In Pantheon, what is Maddie Kim's father's name?",
      answers: ["david kim", "david", "dave", "dave kim"],
      threat: "If you get this wrong, you hate watching shows with me.",
      pass: "Correct. Real fan confirmed.",
      next: ""
    },
    {
      code: "04", title: "The Accusation", type: "choice",
      kicker: "True or false",
      question: "You hate me.",
      options: [
        { text: "TRUE", correct: false, fail: "Your birthday presents are being redirected to Soxy." },
        { text: "FALSE", correct: true }
      ],
      threat: "Choose carefully. If you say TRUE, your birthday presents are being redirected to Soxy.",
      pass: "Correct. Presents stay with you.",
      next: ""
    },
    {
      code: "05", title: "Final Boss: The Ultimate Betrayal", type: "choice",
      kicker: "Final round",
      intro: "You've reached the final test. There can only be ONE correct answer.",
      question: "Who do you love more: me or Bambi?",
      options: [
        { key: "A", text: "You ❤️", correct: true, pass: "Correct. Bambi is sad, but she'll recover." },
        { key: "B", text: "Bambi 🐈", correct: true, pass: "Correct. I'm stealing your cat anyway." },
        { key: "C", text: "Both 🙄", correct: true, pass: "Correct. I'm accusing you of avoiding the question, but you pass." }
      ],
      threat: "If you choose B, I'm stealing your cat. If you choose A, Bambi is sad. If you choose C, I'm accusing you of avoiding the question.",
      pass: "Every answer was correct. You were never in danger.",
      next: ""
    }
  ];

  var FINALE_TITLE = "License renewed.";
  var FINALE_TEXT = "You passed every test, Iron Man. Bambi is a little sad about it, but she'll live.";
  var PRIZE = ""; /* put the prize or the last instruction here, e.g. "Prize: dinner tonight at 7." */
  /* -------------------------------------------------------------------- */

  var KEY = "big-hunt-v2";
  var state = { step: 0, strikes: 0 };

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && typeof saved.step === "number") state = saved;
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); };
  var passedNow = false;
  var passText = null;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderTracker() {
    var t = $("tracker"); t.textContent = "";
    CLUES.forEach(function (_, i) {
      t.appendChild(el("li", i < state.step ? "done" : (i === state.step ? "now" : "")));
    });
    $("stopLabel").textContent = state.step >= CLUES.length
      ? "All " + CLUES.length + " tests passed"
      : "Test " + (state.step + 1) + " of " + CLUES.length;
    $("recordCount").textContent = "On your record: " + state.strikes;
  }

  function renderLog() {
    var done = CLUES.slice(0, state.step);
    $("log").hidden = done.length === 0;
    var ol = $("logList"); ol.textContent = "";
    done.slice().reverse().forEach(function (c) {
      var li = el("li");
      li.appendChild(el("span", "n", c.code));
      var p = el("p", "t", c.title);
      p.appendChild(el("span", "", c.pass));
      li.appendChild(p);
      ol.appendChild(li);
    });
  }

  var lastFocus = null;
  function fail(extra) {
    state.strikes += 1; save(); renderTracker();
    var x = $("mExtra");
    if (extra) { x.textContent = extra; x.hidden = false; } else { x.textContent = ""; x.hidden = true; }
    lastFocus = document.activeElement;
    $("scrim").hidden = false;
    $("tryAgain").focus();
  }
  function closeModal() {
    $("scrim").hidden = true;
    var inp = $("answer");
    if (inp) { inp.focus(); inp.select(); }
    else if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $("tryAgain").addEventListener("click", closeModal);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("scrim").hidden) closeModal();
  });

  function shake(card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }

  function renderStage() {
    var stage = $("stage"); stage.textContent = "";

    if (state.step >= CLUES.length) {
      var f = el("div", "finale");
      f.appendChild(el("h2", "", FINALE_TITLE));
      f.appendChild(el("p", "", FINALE_TEXT));
      if (PRIZE) f.appendChild(el("div", "prize", PRIZE));
      stage.appendChild(f);
      return;
    }

    var c = CLUES[state.step];
    var card = el("div", "clue");
    var head = el("div", "clue-head");
    head.appendChild(el("h2", "", c.title));
    head.appendChild(el("span", "tag", c.code + " / " + String(CLUES.length).padStart(2, "0")));
    card.appendChild(head);
    if (c.intro) card.appendChild(el("p", "intro", c.intro));
    if (c.kicker) card.appendChild(el("p", "kicker", c.kicker));
    card.appendChild(el("p", "riddle", c.question));

    if (passedNow) {
      var go = el("div", "go");
      go.appendChild(el("span", "stamp", "PASSED"));
      go.appendChild(el("span", "tag", c.next ? "Next, go here" : "Result"));
      go.appendChild(el("p", "", c.next || passText || c.pass));
      card.appendChild(go);
      var nb = el("button", "", state.step + 1 >= CLUES.length ? "Get my verdict" : "Next test");
      nb.type = "button";
      nb.addEventListener("click", function () { passedNow = false; state.step += 1; save(); render(); window.scrollTo(0, 0); });
      var r = el("div", "row"); r.appendChild(nb); card.appendChild(r);
      stage.appendChild(card);
      return;
    }

    if (c.type === "text") {
      var form = el("form"); form.setAttribute("autocomplete", "off");
      var input = el("input"); input.type = "text"; input.id = "answer";
      input.placeholder = "Type your answer"; input.setAttribute("aria-label", "Your answer");
      input.setAttribute("autocapitalize", "none");
      var go2 = el("button", "", "Submit"); go2.type = "submit";
      form.appendChild(input); form.appendChild(go2);
      card.appendChild(form);
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var v = norm(input.value);
        if (!v) return;
        var ok = c.answers.some(function (a) { return norm(a) === v; });
        if (ok) { passedNow = true; render(); }
        else { shake(card); fail(null); }
      });
    } else {
      var opts = el("div", "options" + (c.options.length === 2 ? " opts-2" : ""));
      c.options.forEach(function (o) {
        var b = el("button", "opt"); b.type = "button";
        if (o.key) b.appendChild(el("span", "k", o.key));
        b.appendChild(el("span", "", o.text));
        b.addEventListener("click", function () {
          if (o.correct) { passedNow = true; passText = o.pass || null; render(); }
          else { shake(card); fail(o.fail || null); }
        });
        opts.appendChild(b);
      });
      card.appendChild(opts);
    }

    var th = el("p", "threat");
    th.appendChild(el("b", "", "Warning"));
    th.appendChild(document.createTextNode(c.threat));
    card.appendChild(th);

    stage.appendChild(card);
  }

  function render() { renderTracker(); renderStage(); renderLog(); }

  $("lede").textContent = "Hi " + HUNTER + ". " + INTRO;

  var armed = false;
  $("reset").addEventListener("click", function () {
    var b = $("reset");
    if (!armed) { armed = true; b.textContent = "Tap again to confirm"; setTimeout(function () { armed = false; b.textContent = "Start over"; }, 3000); return; }
    armed = false; b.textContent = "Start over";
    state = { step: 0, strikes: 0 }; passedNow = false; save(); render();
  });

  render();
</script>

</body></html>
